# Debian's getty@ keeps what's on the screen (--noclear): clear it, so only /etc/issue and the prompt show
[Service]
# The text shows the running OS slot, known only at boot (the root's changes are in RAM, so /etc/issue can be
# written; if it can't, the login prompt still comes up)
ExecStartPre=-/usr/lib/juggle/slot issue
ExecStart=
ExecStart=-/sbin/agetty -o '-- \\u' --noreset - $TERM
