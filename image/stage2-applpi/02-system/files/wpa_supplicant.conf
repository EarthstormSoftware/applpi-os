# wlan0 uses the config apply-settings writes from this Pi's settings, and stays off if there is no Wi-Fi in them
[Unit]
After=applpi-settings.service
ConditionPathExists=/run/applpi/wpa_supplicant-wlan0.conf

[Service]
ExecStart=
ExecStart=/usr/sbin/wpa_supplicant -c/run/applpi/wpa_supplicant-wlan0.conf -Dnl80211,wext -i%I
