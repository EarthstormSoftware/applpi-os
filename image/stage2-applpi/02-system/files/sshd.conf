# SSH by key only, for the applpi user. The keys come from this Pi's settings (written by apply-settings at boot)
# and the host key lives on the data partition.
HostKey /data/ssh/ssh_host_ed25519_key
AuthorizedKeysFile /run/applpi/authorized_keys/%u
AllowUsers applpi
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
