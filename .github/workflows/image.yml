# Builds the Juggle OS image in the same container as image\build.ps1 (a full build, as for any release), and Juggle
# Flash for Windows and Linux (x64), with juggle beside it, after the tests. A tag (vX.Y.Z) makes a draft release with
# the image, its .bmap, Juggle Flash and SHA256SUMS, for its notes to be written and then published; juggle flash and
# update download published releases. Run by hand (on any branch), they're kept as a test build for a few days instead.
name: Image

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the tags, for the version

      - name: Build the image
        run: |
          version=$(git describe --tags --match 'v[0-9]*' --always --dirty)
          echo "VERSION=$version" >> "$GITHUB_ENV"
          docker build --platform linux/386 --tag juggle-os-builder image
          docker run --name build --privileged \
            --env "JUGGLE_VERSION=$version" --env "JUGGLE_COMMIT=$(git rev-parse --short HEAD)" \
            --env "JUGGLE_BUILD_STAMP=$(date -u +%Y%m%d-%H%M)" --env JUGGLE_QUICK=0 \
            juggle-os-builder ./build-in-container.sh
          mkdir deploy
          docker cp build:/pi-gen/deploy/. deploy/
          ls -l deploy

      - name: Checksums
        working-directory: deploy
        run: |
          test -f "juggle-os-$VERSION.img.xz" && test -f "juggle-os-$VERSION.bmap"
          sha256sum "juggle-os-$VERSION.img.xz" "juggle-os-$VERSION.bmap" > SHA256SUMS
          cat SHA256SUMS

      - name: Keep the image
        uses: actions/upload-artifact@v4
        with:
          name: juggle-os-${{ env.VERSION }}
          path: |
            deploy/juggle-os-*.img.xz
            deploy/juggle-os-*.bmap
            deploy/SHA256SUMS
            deploy/*.info
          retention-days: 7

  flash:
    name: Juggle Flash (${{ matrix.runtime }})
    strategy:
      matrix:
        include:
          # Each on its own system: Windows gives the program its icon, Linux keeps the executable bits
          - runtime: win-x64
            os: windows-latest
          - runtime: linux-x64
            os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the tags, for the version

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test Juggle.slnx

      - name: Publish
        shell: pwsh
        run: ./src/Juggle.Flash/publish.ps1 -Runtime ${{ matrix.runtime }}

      - name: Keep it
        uses: actions/upload-artifact@v4
        with:
          name: juggle-flash-${{ matrix.runtime }}
          path: |
            deploy/juggle-flash-*.zip
            deploy/juggle-flash-*.tar.gz
          retention-days: 7

  release:
    if: github.ref_type == 'tag'
    needs: [build, flash]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: deploy
          merge-multiple: true

      - name: Draft the release
        working-directory: deploy
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          files=("juggle-os-$VERSION.img.xz" "juggle-os-$VERSION.bmap" juggle-flash-"$VERSION"-*)
          ls -l "${files[@]}"
          sha256sum "${files[@]}" > SHA256SUMS
          cat SHA256SUMS
          gh release create "$VERSION" --draft --verify-tag --title "Juggle OS $VERSION" \
            --notes "Images for Raspberry Pis (32-bit, armhf), and Juggle Flash for Windows and Linux (x64), which writes them to a card with a Pi's settings (juggle, the command line, is beside it). Write an image with Juggle Flash, or with \`juggle flash $VERSION\`, which checks it against SHA256SUMS." \
            "${files[@]}" SHA256SUMS
